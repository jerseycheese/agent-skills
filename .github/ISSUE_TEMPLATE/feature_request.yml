name: Feature request
description: Propose a new capability or improvement
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are we trying to solve?
      placeholder: The current workflow does not ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe your preferred approach.
      placeholder: We should add ...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other options did you consider?

  - type: textarea
    id: value
    attributes:
      label: Value and impact
      description: Who benefits and how?
      placeholder: This will improve ...
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: Implementation notes (optional)
      description: Constraints, dependencies, rollout notes, risks
