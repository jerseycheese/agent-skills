name: Bug report
description: Report a reproducible problem
labels:
  - bug
body:
  - type: textarea
    id: plain-summary
    attributes:
      label: Plain-language summary
      description: One or two sentences a non-technical reader would understand. What is broken, in plain terms?
      placeholder: The X button does nothing when you click it, so you can't finish Y.
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear, specific description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal sequence that reproduces the problem.
      placeholder: |
        1. Go to ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What actually happens?
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, shell, and relevant tool/runtime versions.
      placeholder: macOS 14, zsh, node 22, Claude Code 1.x

  - type: textarea
    id: evidence
    attributes:
      label: Logs / screenshots
      description: Command output, stack traces, or screenshots.
      render: shell

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How we'll know it's fixed.
      placeholder: |
        - [ ] The repro above no longer fails
        - [ ] A regression test is added, or a note on why one isn't needed
