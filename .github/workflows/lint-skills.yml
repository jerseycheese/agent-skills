name: Lint skills

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/lint-skills.py
      - run: python3 .github/scripts/eval-triggers.py
      - run: find skills -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - run: bash .github/scripts/test-pr-ready.sh
